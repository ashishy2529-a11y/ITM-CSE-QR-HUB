name: Build subject notes PDF

on:
  push:
    branches: [main]
    paths:
      - 'build_notes.py'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependency
        run: pip install reportlab
      - name: Generate combined notes PDF
        run: python build_notes.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subject-notes.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date"
          else
            git commit -m "Build combined Semester III subject notes PDF"
            git push
          fi
